<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Footer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1>Responsive Footer</h1>
        <h2>Content</h2>
    </header>

    <footer class="footer">
        <!-- Left Section for Payment Methods -->
        <div class="footer-left">
            <h3>Payment Method</h3>
            <div class="credit-cards">
                <img src="assets/visa.svg" alt="Visa">
                <img src="assets/mastercard.svg" alt="MasterCard">
                <a href="https://www.paypal.com/paypalme/rozanrei" target="_blank" rel="noopener noreferrer">
                    <img src="assets/paypal.svg" alt="PayPal">
                </a>
                
            </div>
            <p class="footer-copyright">©️2024 Akhmad Rozan Aditya</p>
        </div>

        <!-- Center Section for Contact Information -->
        <div class="footer-center">
            <div>
                <i class="fa fa-map-marker"></i>
                <p><span>Indonesia </span>Jawa Barat, Tasikmalaya</p>
            </div>
            <div>
                <i class="fa fa-phone"></i>
                <p>+6285161826109</p>
            </div>
            <div>
                <i class="fa fa-envelope"></i>
                <p><a href="mailto:support@gmail.com">support@gmail.com</a></p>
            </div>
        </div>

        <!-- Right Section for About and Social Media Links -->
        <div class="footer-right">
            <p class="footer-about">
                <span>About</span>
                Thank you for taking the time to see my portfolio. Any kind of support is much appreciated.
                For personal requests and more, feel free to reach out!
            </p>
            <div class="footer-media">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f fa-2x"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram fa-2x"></i></a>
                <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp fa-2x"></i></a>
            </div>
                     
        </div>
    </footer>
</body>
</html>
